apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-shop-child       
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Yashdubey455/argocd-demos.git 
    targetRevision: main
    path: declarative_approach/online_shop  
  destination:
    server: https://kubernetes.default.svc 
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
